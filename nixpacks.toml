# Railway / Nixpacks — Laravel + php artisan serve (producción)
# Ver docs/deploy/RAILWAY.md. nginx.template.conf queda opcional si añades nginx al build.

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.pgsql",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.bcmath",
  "php83Extensions.fileinfo",
  "php83Extensions.tokenizer",
  "php83Extensions.ctype",
  "php83Extensions.openssl",
  "nodejs_20",
  "phpPackages.composer"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install",
  "npm run build"
]

[phases.build]
cmds = [
  "if [ -f .user.ini ]; then UPLOAD_INI_PATH=$(find /nix/store -path '*/lib/php.ini' 2>/dev/null | tail -n 1); if [ -n \"$UPLOAD_INI_PATH\" ]; then echo '--- .user.ini ---' >> \"$UPLOAD_INI_PATH\"; cat .user.ini >> \"$UPLOAD_INI_PATH\"; fi; fi",
  "chmod +x scripts/railway-start.sh",
  "php artisan config:cache || true",
  "php artisan route:cache || true",
  "php artisan view:cache || true",
  "php artisan event:cache || true"
]

# Sin [start] aquí: Railway usa scripts/railway-start.sh (artisan serve en $PORT).
# Migraciones: preDeployCommand en railway.json
